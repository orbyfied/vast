[workspace]
resolver = "2"
members = [
    "compiler/*"
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.93.0"

[workspace.dependencies]
# internal subprojects
vastc_supplemental = { path = "compiler/vastc_supplemental" }
vastc_impl = { path = "compiler/vastc_impl" }
# external dependencies
clap = { version = "4.6.6", features = ["derive"] }
inkwell = { version = "0.10.0", features = ["llvm-sys-221", "llvm22-1"] }

[profile.release]
lto = true
codegen-units = 1